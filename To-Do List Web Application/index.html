<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">My To-Do List</span>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card shadow-lg border-0 p-4 w-100" style="max-width: 600px; border-radius: 15px;">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold">Task Manager</h2>
                <p class="text-muted">Organize your tasks and stay productive.</p>
            </div>

            <div class="input-group mb-2">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                <button class="btn btn-primary" id="addTaskBtn" type="button">Add Task</button>
            </div>
            
            <div id="errorMessage" class="text-danger small mb-3 d-none">Task cannot be empty!</div>

            <div class="d-flex justify-content-between align-items-center mb-3 mt-2">
                <span class="fw-semibold text-secondary">Your tasks</span>
                <span class="badge bg-primary" id="taskCounter">0 remaining</span>
            </div>

            <div class="btn-group w-100 mb-3" role="group">
                <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul class="list-group mb-3" id="taskList"></ul>
            
            <div id="emptyState" class="text-center text-muted small my-3">
                No tasks yet. Add your first task!
            </div>

            <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
